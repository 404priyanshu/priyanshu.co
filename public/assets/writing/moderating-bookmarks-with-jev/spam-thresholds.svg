<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 232" width="520" height="232" role="img" aria-labelledby="title desc">
  <title id="title">Spam probability thresholds</title>
  <desc id="desc">A scale of spam probability from 0 to 1. Below 0.5 the submission is accepted. From 0.5 to 0.9 it is flagged for review. From 0.9 up it is rejected, but only when the page was readable. A wrong accept costs one row to delete; a wrong reject turns away someone's real link, so the reject band is kept narrow.</desc>
  <style>
    text { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #18181b; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.08em; fill: #71717a; }
    .band { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.08em; fill: #3f3f46; }
    .head { font-size: 14px; font-weight: 500; }
    .cost { font-size: 13.5px; fill: #52525b; }
    .note { font-size: 13px; fill: #71717a; }
    .marker { animation: sweep 8s linear infinite; }
    .hl { opacity: 0; animation: 8s linear infinite; }
    .hl-accept { animation-name: hl-accept; }
    .hl-review { animation-name: hl-review; }
    .hl-reject { animation-name: hl-reject; }
    @keyframes sweep {
      0% { transform: translateX(0); opacity: 0; }
      4% { opacity: 1; }
      70% { transform: translateX(472px); }
      92% { transform: translateX(472px); opacity: 1; }
      100% { transform: translateX(472px); opacity: 0; }
    }
    @keyframes hl-accept { 0%, 34.5% { opacity: 1; } 35.5%, 100% { opacity: 0; } }
    @keyframes hl-review { 0%, 34.5% { opacity: 0; } 35.5%, 62.5% { opacity: 1; } 63.5%, 100% { opacity: 0; } }
    @keyframes hl-reject { 0%, 62.5% { opacity: 0; } 63.5%, 92% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .marker { animation: none; opacity: 0; }
      .hl { animation: none; opacity: 1; }
    }
  </style>

  <rect width="520" height="232" fill="#fafafa" />

  <defs>
    <clipPath id="bar">
      <rect x="24" y="78" width="472" height="10" rx="5" />
    </clipPath>
  </defs>

  <text class="mono" x="24" y="30">SPAM PROBABILITY</text>

  <text class="band" x="142" y="66" text-anchor="middle">ACCEPT</text>
  <text class="band" x="354" y="66" text-anchor="middle">REVIEW</text>
  <text class="band" x="496" y="66" text-anchor="end">REJECT</text>

  <g clip-path="url(#bar)">
    <rect x="24" y="78" width="236" height="10" fill="#22c55e" opacity="0.22" />
    <rect x="260" y="78" width="189" height="10" fill="#f59e0b" opacity="0.22" />
    <rect x="449" y="78" width="47" height="10" fill="#ef4444" opacity="0.22" />
    <rect class="hl hl-accept" x="24" y="78" width="236" height="10" fill="#22c55e" />
    <rect class="hl hl-review" x="260" y="78" width="189" height="10" fill="#f59e0b" />
    <rect class="hl hl-reject" x="449" y="78" width="47" height="10" fill="#ef4444" />
  </g>
  <line x1="260" y1="76" x2="260" y2="90" stroke="#fafafa" stroke-width="2" />
  <line x1="449" y1="76" x2="449" y2="90" stroke="#fafafa" stroke-width="2" />

  <g class="marker">
    <line x1="24" y1="70" x2="24" y2="96" stroke="#18181b" stroke-width="2" />
    <circle cx="24" cy="70" r="3" fill="#18181b" />
  </g>

  <text class="mono" x="24" y="112">0</text>
  <text class="mono" x="260" y="112" text-anchor="middle">0.5</text>
  <text class="mono" x="449" y="112" text-anchor="middle">0.9</text>
  <text class="mono" x="496" y="112" text-anchor="end">1</text>

  <text class="head" x="24" y="152">Wrong accept?</text>
  <text class="cost" x="24" y="172">I delete a row.</text>
  <text class="head" x="496" y="152" text-anchor="end">Wrong reject?</text>
  <text class="cost" x="496" y="172" text-anchor="end">A real link gets turned away.</text>

  <line x1="24" y1="192" x2="496" y2="192" stroke="#e4e4e7" stroke-width="1" />
  <text class="note" x="24" y="214">Reject needs a readable page. Otherwise it stops at Review.</text>
</svg>
