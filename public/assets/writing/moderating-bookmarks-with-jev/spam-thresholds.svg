<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Spam probability thresholds</title>
  <desc id="desc">A scale of spam probability from 0 to 1. Below 0.5 the submission is accepted. From 0.5 to 0.9 it is flagged for review. From 0.9 up it is rejected, but only when the page was readable. A wrong accept costs one row to delete; a wrong reject turns away someone's real link, so the reject band is kept narrow.</desc>
  <style>
    text { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #18181b; }
    .title { font-size: 20px; font-weight: 600; }
    .band-label { font-size: 19px; font-weight: 600; }
    .tick { font-size: 17px; fill: #52525b; font-variant-numeric: tabular-nums; }
    .cost-head { font-size: 18px; font-weight: 600; }
    .cost { font-size: 18px; fill: #3f3f46; }
    .note { font-size: 17px; fill: #52525b; }
    .marker { animation: sweep 8s linear infinite; }
    .hl { opacity: 0; animation: 8s linear infinite; }
    .hl-accept { animation-name: hl-accept; }
    .hl-review { animation-name: hl-review; }
    .hl-reject { animation-name: hl-reject; }
    @keyframes sweep {
      0% { transform: translateX(0); opacity: 0; }
      4% { opacity: 1; }
      70% { transform: translateX(518px); }
      92% { transform: translateX(518px); opacity: 1; }
      100% { transform: translateX(518px); opacity: 0; }
    }
    @keyframes hl-accept {
      0%, 34.5% { opacity: 1; }
      35.5%, 100% { opacity: 0; }
    }
    @keyframes hl-review {
      0%, 34.5% { opacity: 0; }
      35.5%, 62.5% { opacity: 1; }
      63.5%, 100% { opacity: 0; }
    }
    @keyframes hl-reject {
      0%, 62.5% { opacity: 0; }
      63.5%, 92% { opacity: 1; }
      100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .marker, .hl { animation: none; opacity: 0; }
    }
  </style>

  <rect width="600" height="330" fill="#fafafa" />

  <text class="title" x="40" y="44">Spam probability from the Noul</text>

  <!-- Band labels -->
  <text class="band-label" x="170" y="96" text-anchor="middle">Accept</text>
  <text class="band-label" x="404" y="96" text-anchor="middle">Review</text>
  <text class="band-label" x="540" y="96" text-anchor="middle">Reject</text>

  <!-- Bands -->
  <rect x="40" y="110" width="260" height="44" fill="#EEEDFB" stroke="#7F77DD" stroke-width="1.5" />
  <rect x="300" y="110" width="208" height="44" fill="#FDF1DF" stroke="#EF9F27" stroke-width="1.5" />
  <rect x="508" y="110" width="52" height="44" fill="#FBE7E0" stroke="#D85A30" stroke-width="1.5" />

  <!-- Active-band highlights -->
  <rect class="hl hl-accept" x="40" y="110" width="260" height="44" fill="#7F77DD" fill-opacity="0.28" stroke="#7F77DD" stroke-width="3" />
  <rect class="hl hl-review" x="300" y="110" width="208" height="44" fill="#EF9F27" fill-opacity="0.3" stroke="#EF9F27" stroke-width="3" />
  <rect class="hl hl-reject" x="508" y="110" width="52" height="44" fill="#D85A30" fill-opacity="0.3" stroke="#D85A30" stroke-width="3" />

  <!-- Sweeping marker -->
  <g class="marker">
    <line x1="41" y1="104" x2="41" y2="160" stroke="#18181b" stroke-width="2.5" />
    <circle cx="41" cy="104" r="4.5" fill="#18181b" />
  </g>

  <!-- Ticks -->
  <g stroke="#a1a1aa" stroke-width="1.5">
    <line x1="40" y1="154" x2="40" y2="164" />
    <line x1="300" y1="154" x2="300" y2="164" />
    <line x1="508" y1="154" x2="508" y2="164" />
    <line x1="560" y1="154" x2="560" y2="164" />
  </g>
  <text class="tick" x="40" y="188" text-anchor="middle">0</text>
  <text class="tick" x="300" y="188" text-anchor="middle">0.5</text>
  <text class="tick" x="500" y="188" text-anchor="middle">0.9</text>
  <text class="tick" x="564" y="188" text-anchor="middle">1</text>

  <!-- Costs -->
  <text class="cost-head" x="40" y="230">Wrong accept?</text>
  <text class="cost" x="40" y="256">I delete a row.</text>

  <text class="cost-head" x="560" y="230" text-anchor="end">Wrong reject?</text>
  <text class="cost" x="560" y="256" text-anchor="end">A real link gets turned away.</text>

  <line x1="40" y1="276" x2="560" y2="276" stroke="#e4e4e7" stroke-width="1" />
  <text class="note" x="40" y="304">Reject needs a readable page. Otherwise it stops at Review.</text>
</svg>
