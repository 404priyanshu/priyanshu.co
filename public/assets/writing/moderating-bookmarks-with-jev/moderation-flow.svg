<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420" role="img" aria-labelledby="title desc">
  <title id="title">How a bookmark submission is moderated</title>
  <desc id="desc">Five steps. 1: someone submits a URL. 2: validate, bot check and rate limit. 3: fetch a preview of the page, public http or https only, 4 seconds, 256 KB; if the page is unreadable, continue with the URL alone. 4: ask Jev three questions in one request: is it spam (a Noul), is it a good fit (a Noul), and which collection (a Choice); with no API key or an API error, moderation is skipped and the submission goes through as before. 5: apply the policy in code, which ends in reject (422, not stored), review (stored and flagged) or accept (stored).</desc>
  <style>
    text { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #18181b; }
    .num, .tag, .type { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: 0.06em; }
    .num { font-size: 11px; fill: #8a8a92; }
    .step { font-size: 15px; font-weight: 500; }
    .sub { font-size: 13px; fill: #71717a; }
    .tag { font-size: 10px; fill: #8a8a92; }
    .chip { font-size: 13px; fill: #3f3f46; }
    .type { font-size: 10px; fill: #71717a; }
    .out { font-size: 13.5px; font-weight: 500; }
    .card { fill: #ffffff; stroke: #e4e4e7; stroke-width: 1; }
    .dot { fill: #ffffff; stroke: #a1a1aa; stroke-width: 1.25; }
    .progress { fill: none; stroke: #18181b; stroke-width: 1.5; stroke-dasharray: 294; stroke-dashoffset: 294; animation: rail 7s ease-in-out infinite; }
    .reached { fill: #18181b; opacity: 0; animation: 7s ease-in-out infinite; }
    .d1 { animation-name: d1; } .d2 { animation-name: d2; } .d3 { animation-name: d3; } .d4 { animation-name: d4; } .d5 { animation-name: d5; }
    @keyframes rail { 0% { stroke-dashoffset: 294; opacity: 1; } 55% { stroke-dashoffset: 0; } 85% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes d1 { 0% { opacity: 0; } 2%, 85% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes d2 { 0%, 8% { opacity: 0; } 10%, 85% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes d3 { 0%, 16% { opacity: 0; } 18%, 85% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes d4 { 0%, 33% { opacity: 0; } 35%, 85% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes d5 { 0%, 54% { opacity: 0; } 56%, 85% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .progress, .reached { animation: none; opacity: 0; }
    }
  </style>

  <rect width="520" height="420" fill="#fafafa" />

  <!-- Rail -->
  <line x1="50" y1="35" x2="50" y2="329" stroke="#e4e4e7" stroke-width="1.5" />
  <path class="progress" d="M50 35 V329" />
  <circle class="dot" cx="50" cy="35" r="3.5" />
  <circle class="dot" cx="50" cy="81" r="3.5" />
  <circle class="dot" cx="50" cy="127" r="3.5" />
  <circle class="dot" cx="50" cy="217" r="3.5" />
  <circle class="dot" cx="50" cy="329" r="3.5" />
  <circle class="reached d1" cx="50" cy="35" r="3.5" />
  <circle class="reached d2" cx="50" cy="81" r="3.5" />
  <circle class="reached d3" cx="50" cy="127" r="3.5" />
  <circle class="reached d4" cx="50" cy="217" r="3.5" />
  <circle class="reached d5" cx="50" cy="329" r="3.5" />

  <!-- 01 -->
  <text class="num" x="20" y="40">01</text>
  <text class="step" x="66" y="40">Someone submits a URL</text>

  <!-- 02 -->
  <text class="num" x="20" y="86">02</text>
  <text class="step" x="66" y="86">Validate, bot check, rate limit</text>

  <!-- 03 -->
  <text class="num" x="20" y="132">03</text>
  <text class="step" x="66" y="132">Fetch a preview of the page</text>
  <text class="sub" x="66" y="152">Public http(s) only · 4 s · 256 KB</text>
  <text class="tag" x="66" y="174">FALLBACK</text>
  <text class="sub" x="130" y="174">Unreadable? Continue with the URL alone</text>

  <!-- 04 -->
  <text class="num" x="20" y="222">04</text>
  <text class="step" x="66" y="222">Ask Jev, in one request</text>
  <rect class="card" x="66" y="234" width="96" height="26" rx="6" />
  <text class="chip" x="76" y="251">Spam?</text>
  <text class="type" x="152" y="251" text-anchor="end">NOUL</text>
  <rect class="card" x="170" y="234" width="110" height="26" rx="6" />
  <text class="chip" x="180" y="251">Good fit?</text>
  <text class="type" x="270" y="251" text-anchor="end">NOUL</text>
  <rect class="card" x="288" y="234" width="180" height="26" rx="6" />
  <text class="chip" x="298" y="251">Which collection?</text>
  <text class="type" x="458" y="251" text-anchor="end">CHOICE</text>
  <text class="tag" x="66" y="284">FALLBACK</text>
  <text class="sub" x="130" y="284">No key or API error? Submit as before</text>

  <!-- 05 -->
  <text class="num" x="20" y="334">05</text>
  <text class="step" x="66" y="334">Apply the policy in code</text>

  <rect class="card" x="66" y="350" width="136" height="48" rx="8" />
  <circle cx="80" cy="368" r="3.5" fill="#ef4444" />
  <text class="out" x="90" y="373">Reject</text>
  <text class="sub" x="80" y="390">422, not stored</text>

  <rect class="card" x="210" y="350" width="136" height="48" rx="8" />
  <circle cx="224" cy="368" r="3.5" fill="#f59e0b" />
  <text class="out" x="234" y="373">Review</text>
  <text class="sub" x="224" y="390">Stored, flagged</text>

  <rect class="card" x="354" y="350" width="136" height="48" rx="8" />
  <circle cx="368" cy="368" r="3.5" fill="#22c55e" />
  <text class="out" x="378" y="373">Accept</text>
  <text class="sub" x="368" y="390">Stored</text>
</svg>
