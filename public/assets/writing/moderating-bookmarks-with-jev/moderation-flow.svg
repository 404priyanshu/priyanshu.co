<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" width="600" height="640" role="img" aria-labelledby="title desc">
  <title id="title">How a bookmark submission is moderated</title>
  <desc id="desc">A submission is validated, then the server fetches a preview of the page. If the page cannot be read, the flow continues with the URL only. Jev answers three questions in one request: is it spam, does it fit the collection, and which collection it belongs in. If there is no API key or the API fails, moderation is skipped and the submission goes through as before. Code then applies the policy, which ends in one of three outcomes: reject, flag for review, or accept.</desc>
  <style>
    text { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #18181b; }
    .title { font-size: 19px; font-weight: 600; }
    .sub { font-size: 16px; fill: #52525b; }
    .note { font-size: 16px; fill: #52525b; }
    .chip { font-size: 17px; }
    .type { font-size: 16px; fill: #6d65c9; font-weight: 600; }
    .stage { fill: #ffffff; stroke: #d4d4d8; stroke-width: 1.5; }
    .pulse { fill: none; stroke: #7F77DD; stroke-width: 3; opacity: 0; animation: pulse 7s ease-in-out infinite; }
    .s2 { animation-delay: 0.7s; }
    .s3 { animation-delay: 1.4s; }
    .s4 { animation-delay: 2.1s; }
    .s5 { animation-delay: 2.8s; }
    .s6 { animation-delay: 3.5s; }
    @keyframes pulse {
      0% { opacity: 0; }
      4% { opacity: 1; }
      14% { opacity: 1; }
      22% { opacity: 0; }
      100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none; opacity: 0; }
    }
  </style>

  <rect width="600" height="640" fill="#fafafa" />

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a1a1aa" />
    </marker>
  </defs>

  <!-- Spine arrows -->
  <g stroke="#a1a1aa" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="188" y1="76" x2="188" y2="98" />
    <line x1="188" y1="156" x2="188" y2="178" />
    <line x1="188" y1="252" x2="188" y2="274" />
    <line x1="188" y1="426" x2="188" y2="448" />
  </g>

  <!-- Stage 1 -->
  <rect class="stage" x="20" y="20" width="336" height="56" rx="10" />
  <rect class="pulse" x="20" y="20" width="336" height="56" rx="10" />
  <text class="title" x="188" y="54" text-anchor="middle">Someone submits a URL</text>

  <!-- Stage 2 -->
  <rect class="stage" x="20" y="100" width="336" height="56" rx="10" />
  <rect class="pulse s2" x="20" y="100" width="336" height="56" rx="10" />
  <text class="title" x="188" y="134" text-anchor="middle">Validate, bot check, rate limit</text>

  <!-- Stage 3 -->
  <rect class="stage" x="20" y="180" width="336" height="72" rx="10" />
  <rect class="pulse s3" x="20" y="180" width="336" height="72" rx="10" />
  <text class="title" x="188" y="210" text-anchor="middle">Fetch a preview of the page</text>
  <text class="sub" x="188" y="236" text-anchor="middle">Public http(s) only · 4 s · 256 KB</text>

  <line x1="356" y1="216" x2="372" y2="216" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="4 4" />
  <rect x="374" y="182" width="206" height="68" rx="10" fill="none" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="4 4" />
  <text class="note" x="388" y="208">Unreadable?</text>
  <text class="note" x="388" y="230">Continue with the URL</text>

  <!-- Stage 4 -->
  <rect class="stage" x="20" y="276" width="336" height="150" rx="10" />
  <rect class="pulse s4" x="20" y="276" width="336" height="150" rx="10" />
  <text class="title" x="188" y="306" text-anchor="middle">Ask Jev, in one request</text>
  <g>
    <rect x="38" y="322" width="300" height="28" rx="6" fill="#f4f4f5" />
    <text class="chip" x="52" y="341">Is it spam?</text>
    <text class="type" x="326" y="341" text-anchor="end">Noul</text>
    <rect x="38" y="356" width="300" height="28" rx="6" fill="#f4f4f5" />
    <text class="chip" x="52" y="375">Does it fit the collection?</text>
    <text class="type" x="326" y="375" text-anchor="end">Noul</text>
    <rect x="38" y="390" width="300" height="28" rx="6" fill="#f4f4f5" />
    <text class="chip" x="52" y="409">Which collection?</text>
    <text class="type" x="326" y="409" text-anchor="end">Choice</text>
  </g>

  <line x1="356" y1="351" x2="372" y2="351" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="4 4" />
  <rect x="374" y="306" width="206" height="90" rx="10" fill="none" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="4 4" />
  <text class="note" x="388" y="332">No key or API error?</text>
  <text class="note" x="388" y="354">Skip moderation and</text>
  <text class="note" x="388" y="376">submit as before</text>

  <!-- Stage 5 -->
  <rect class="stage" x="20" y="450" width="336" height="56" rx="10" />
  <rect class="pulse s5" x="20" y="450" width="336" height="56" rx="10" />
  <text class="title" x="188" y="484" text-anchor="middle">Apply the policy in code</text>

  <!-- Branches -->
  <g stroke="#a1a1aa" stroke-width="1.5" fill="none">
    <path d="M188 506 V532" />
    <path d="M110 532 H490" />
  </g>
  <g stroke="#a1a1aa" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M110 532 V558" />
    <path d="M300 532 V558" />
    <path d="M490 532 V558" />
  </g>

  <!-- Outcomes -->
  <rect x="20" y="560" width="180" height="60" rx="10" fill="#FBE7E0" stroke="#D85A30" stroke-width="1.5" />
  <rect x="210" y="560" width="180" height="60" rx="10" fill="#FDF1DF" stroke="#EF9F27" stroke-width="1.5" />
  <rect x="400" y="560" width="180" height="60" rx="10" fill="#EEEDFB" stroke="#7F77DD" stroke-width="1.5" />
  <rect class="pulse s6" x="20" y="560" width="180" height="60" rx="10" />
  <rect class="pulse s6" x="210" y="560" width="180" height="60" rx="10" />
  <rect class="pulse s6" x="400" y="560" width="180" height="60" rx="10" />
  <text class="title" x="110" y="586" text-anchor="middle">Reject</text>
  <text class="sub" x="110" y="608" text-anchor="middle">422, not stored</text>
  <text class="title" x="300" y="586" text-anchor="middle">Review</text>
  <text class="sub" x="300" y="608" text-anchor="middle">Stored, flagged</text>
  <text class="title" x="490" y="586" text-anchor="middle">Accept</text>
  <text class="sub" x="490" y="608" text-anchor="middle">Stored</text>
</svg>
