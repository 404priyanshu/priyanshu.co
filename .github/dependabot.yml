version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - '*'

  # Needs the text-based bun.lock; Dependabot cannot read the binary
  # bun.lockb this repo used until the migration.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    open-pull-requests-limit: 5
    groups:
      # Majors stay separate so they are reviewed one at a time.
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
